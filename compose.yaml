name: aws-voice-agent
services:
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,sqs,dynamodb,dynamodbstreams,iam,sts,lambda,logs,cloudwatch,kms
      AWS_DEFAULT_REGION: eu-central-1
      LAMBDA_DOCKER_NETWORK: aws-voice-agent_default
      LAMBDA_KEEPALIVE_MS: "0"
      DEBUG: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
